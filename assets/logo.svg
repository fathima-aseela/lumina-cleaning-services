<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70" aria-label="Lumina Cleaning Services Logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;display=swap');
      .logo-text-serif {
        font-family: 'Playfair Display', 'Bodoni MT', 'Didot', 'Georgia', serif;
        font-size: 52px;
        font-weight: 700;
        fill: #1A365D;
        letter-spacing: -0.5px;
      }
      .star-gold {
        fill: #E5B842;
